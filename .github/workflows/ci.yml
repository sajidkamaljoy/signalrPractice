name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # The solution contains a WPF client (net8.0-windows), which needs a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore signalr.sln

      - name: Build
        run: dotnet build signalr.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test signalr.sln --configuration Release --no-build --verbosity normal
